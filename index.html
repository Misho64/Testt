<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مولّد QR Code الإحترافي الفني</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card: rgba(23, 32, 54, 0.9);
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at top right, #1e1b4b, #0b0f19 75%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      background: var(--card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 26px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    h1 {
      font-size: 1.35rem;
      text-align: center;
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: bold;
      margin: 14px 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    input[type="text"], input[type="file"], input[type="password"], select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.85);
      color: white;
      outline: none;
      font-size: 0.88rem;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--primary);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .optional-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.86rem;
      color: var(--text);
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .sub-controls {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: none;
    }

    .color-pickers {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .color-pickers input[type="color"] {
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
    }

    button.btn-main {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 16px;
    }

    button.btn-main:hover {
      background: var(--primary-hover);
    }

    .preview-box {
      margin-top: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 14px;
      background: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .download-btn {
      background: #10b981;
      margin-top: 14px;
      display: none;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    /* نافذة فك القفل */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-content {
      background: #1e293b;
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 16px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }

    .modal-content h3 {
      font-size: 1.15rem;
      margin-bottom: 8px;
    }

    .modal-content p {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .modal-input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      text-align: center;
      font-size: 1.1rem;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .btn-group-modal {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-confirm { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-wa { background: #25d366; color: white; text-decoration: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-close { background: transparent; color: var(--text-muted); border: 1px solid #475569; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; }
  </style>
</head>
<body>

<div class="container">
  <h1>مولّد رمز QR المخصص</h1>

  <!-- نوع الإجراء المباشر -->
  <div class="form-group">
    <label>نوع الإجراء / المحتوى (اختياري):</label>
    <select id="actionType" onchange="renderActionInputs()">
      <option value="url">رابط موقع مباشر (URL)</option>
      <option value="whatsapp">محادثة واتساب مباشرة (WhatsApp)</option>
      <option value="wifi">اتصال بشبكة واي فاي (Wi-Fi)</option>
      <option value="vcard">بطاقة جهة اتصال (vCard)</option>
      <option value="text">نص مخصص / باركود</option>
    </select>
  </div>

  <!-- حقول الإجراء الديناميكية -->
  <div id="dynamicActionContainer"></div>

  <div class="form-group">
    <label>اختر الصورة الشخصية / الخلفية:</label>
    <input type="file" id="imageInput" accept="image/*">
  </div>

  <div class="section-title">التخصيص الأساسي</div>
  <div class="grid-2">
    <div class="form-group">
      <label>شكل النقاط:</label>
      <select id="dotShape">
        <option value="circle">دوائر (Dots)</option>
        <option value="square">مربعات كلاسيكية</option>
        <option value="rounded">مربعات ناعمة</option>
        <option value="diamond">مضلع (Diamond)</option>
      </select>
    </div>
    <div class="form-group">
      <label>شكل زوايا التوجيه:</label>
      <select id="finderShape">
        <option value="classic">مربع كلاسيكي</option>
        <option value="rounded">زوايا مستديرة</option>
        <option value="circle">عيون دائرية</option>
      </select>
    </div>
  </div>

  <div class="grid-2">
    <div class="form-group">
      <label>تباين الصورة:</label>
      <input type="range" id="contrastRange" min="1" max="2.4" step="0.1" value="1.3">
    </div>
    <div class="form-group">
      <label>حجم النقاط:</label>
      <input type="range" id="dotSizeRange" min="0.25" max="0.45" step="0.02" value="0.34">
    </div>
  </div>

  <div class="section-title">تأثيرات إضافية (اختيارية)</div>

  <!-- خيار التأثير المتحرك -->
  <div class="optional-box">
    <label class="checkbox-label">
      <input type="checkbox" id="enableAnimation">
      تفعيل الرمز المتحرك (Animated Scan Laser & Glow) — اختياري
    </label>
  </div>

  <!-- خيار التدرجات اللونية -->
  <div class="optional-box">
    <label class="checkbox-label">
      <input type="checkbox" id="enableGradient">
      تفعيل التدرجات اللونية (Gradient) — اختياري
    </label>
    <div class="sub-controls" id="gradientControls">
      <div class="color-pickers">
        <label style="margin:0; font-size:0.75rem;">اللون 1:</label>
        <input type="color" id="gradColor1" value="#2563eb">
        <label style="margin:0; font-size:0.75rem;">اللون 2:</label>
        <input type="color" id="gradColor2" value="#9333ea">
      </div>
    </div>
  </div>

  <!-- خيار التأثير الزجاجي -->
  <div class="optional-box">
    <label class="checkbox-label">
      <input type="checkbox" id="enableGlass">
      تفعيل التأثير الزجاجي (Glassmorphism) — اختياري
    </label>
  </div>

  <!-- خيار شعار المنتصف -->
  <div class="optional-box">
    <label class="checkbox-label">
      <input type="checkbox" id="showLogoBadge" checked>
      إظهار شعار المنتصف (6m4.me)
    </label>
  </div>

  <button class="btn-main" onclick="triggerGenerate()">إنشاء الرمز</button>

  <div class="preview-box">
    <canvas id="qrCanvas" width="600" height="600" style="display:none;"></canvas>
    <button id="downloadBtn" class="download-btn" onclick="downloadQR()">تحميل الرمز بصيغة PNG</button>
  </div>
</div>

<!-- نافذة إدخال الرمز للشراء أو الحذف -->
<div class="modal-overlay" id="unlockModal">
  <div class="modal-content">
    <h3>إزالة شعار المنتصف</h3>
    <p>لإخفاء شعار 6m4.me، أدخل رمز التفعيل الخاص بك:</p>
    <input type="password" id="passcodeInput" class="modal-input" placeholder="اكتب الرمز">
    <div class="btn-group-modal">
      <button class="btn-confirm" onclick="verifyPasscode()">تأكيد التفعيل</button>
      <a href="https://wa.me/201551179695?text=مرحبا،%20أريد%20شراء%20كود%20إزالة%20شعار%20الـ%20QR" target="_blank" class="btn-wa">
        شراء الرمز عبر واتساب (01551179695)
      </a>
      <button class="btn-close" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<script>
  let cachedImg = null;
  let isUnlocked = false;
  let animationFrameId = null;
  let animProgress = 0;

  // توليد واجهات الإجراءات المباشرة
  function renderActionInputs() {
    const type = document.getElementById('actionType').value;
    const container = document.getElementById('dynamicActionContainer');
    let html = '';

    if (type === 'url') {
      html = `
        <div class="form-group">
          <label>رابط الموقع:</label>
          <input type="text" id="targetUrl" value="https://6m4.me" placeholder="https://example.com">
        </div>`;
    } else if (type === 'whatsapp') {
      html = `
        <div class="grid-2">
          <div class="form-group">
            <label>رقم الهاتف مع كود الدولة:</label>
            <input type="text" id="waPhone" value="201551179695" placeholder="مثال: 201012345678">
          </div>
          <div class="form-group">
            <label>الرسالة التلقائية:</label>
            <input type="text" id="waMsg" value="مرحباً، أود التواصل معك" placeholder="اكتب نص الرسالة">
          </div>
        </div>`;
    } else if (type === 'wifi') {
      html = `
        <div class="grid-2">
          <div class="form-group">
            <label>اسم الشبكة (SSID):</label>
            <input type="text" id="wifiSsid" placeholder="اسم الواي فاي">
          </div>
          <div class="form-group">
            <label>كلمة المرور:</label>
            <input type="text" id="wifiPass" placeholder="رمز المرور">
          </div>
        </div>`;
    } else if (type === 'vcard') {
      html = `
        <div class="grid-2">
          <div class="form-group">
            <label>الاسم بالكامل:</label>
            <input type="text" id="vName" placeholder="الاسم">
          </div>
          <div class="form-group">
            <label>رقم الهاتف:</label>
            <input type="text" id="vPhone" placeholder="رقم الهاتف">
          </div>
        </div>`;
    } else if (type === 'text') {
      html = `
        <div class="form-group">
          <label>النص أو الرمز المخصص:</label>
          <input type="text" id="plainText" placeholder="اكتب النص هنا">
        </div>`;
    }
    container.innerHTML = html;
  }
  renderActionInputs();

  // الحصول على النص المنسق حسب الإجراء المختار
  function getPayload() {
    const type = document.getElementById('actionType').value;
    if (type === 'url') return (document.getElementById('targetUrl').value || 'https://6m4.me').trim();
    if (type === 'whatsapp') {
      const phone = (document.getElementById('waPhone').value || '').trim();
      const msg = encodeURIComponent((document.getElementById('waMsg').value || '').trim());
      return `https://wa.me/${phone}?text=${msg}`;
    }
    if (type === 'wifi') {
      const ssid = (document.getElementById('wifiSsid').value || '').trim();
      const pass = (document.getElementById('wifiPass').value || '').trim();
      return `WIFI:T:WPA;S:${ssid};P:${pass};;`;
    }
    if (type === 'vcard') {
      const name = (document.getElementById('vName').value || '').trim();
      const phone = (document.getElementById('vPhone').value || '').trim();
      return `BEGIN:VCARD\nVERSION:3.0\nN:${name}\nTEL:${phone}\nEND:VCARD`;
    }
    if (type === 'text') return (document.getElementById('plainText').value || '').trim();
    return 'https://6m4.me';
  }

  // مستمع الصورة
  document.getElementById('imageInput').addEventListener('change', function(e) {
    if (e.target.files && e.target.files[0]) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        cachedImg = new Image();
        cachedImg.onload = triggerGenerate;
        cachedImg.src = evt.target.result;
      };
      reader.readAsDataURL(e.target.files[0]);
    }
  });

  document.getElementById('enableGradient').addEventListener('change', function() {
    document.getElementById('gradientControls').style.display = this.checked ? 'block' : 'none';
    if (cachedImg) triggerGenerate();
  });

  document.getElementById('enableAnimation').addEventListener('change', function() {
    if (cachedImg) triggerGenerate();
  });

  document.getElementById('showLogoBadge').addEventListener('click', function(e) {
    if (!this.checked && !isUnlocked) {
      e.preventDefault();
      document.getElementById('unlockModal').style.display = 'flex';
      document.getElementById('passcodeInput').value = '';
    } else {
      if (cachedImg) triggerGenerate();
    }
  });

  function verifyPasscode() {
    const code = document.getElementById('passcodeInput').value.trim();
    if (code === '64') {
      isUnlocked = true;
      document.getElementById('showLogoBadge').checked = false;
      closeModal();
      if (cachedImg) triggerGenerate();
    } else {
      alert("الرمز غير صحيح!");
    }
  }

  function closeModal() {
    document.getElementById('unlockModal').style.display = 'none';
  }

  ['contrastRange', 'dotSizeRange', 'dotShape', 'finderShape', 'gradColor1', 'gradColor2', 'enableGlass'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => { if (cachedImg) triggerGenerate(); });
  });

  function isInsideFinder(r, c, count) {
    if (r < 7 && c < 7) return true;
    if (r < 7 && c >= count - 7) return true;
    if (r >= count - 7 && c < 7) return true;
    return false;
  }

  function isInsideCenterLogo(r, c, count) {
    if (!document.getElementById('showLogoBadge').checked) return false;
    const mid = Math.floor(count / 2);
    return Math.abs(r - mid) <= 2 && Math.abs(c - mid) <= 4;
  }

  function drawModule(ctx, shape, x, y, size) {
    const half = size / 2;
    ctx.beginPath();
    if (shape === 'circle') {
      ctx.arc(x, y, half, 0, Math.PI * 2);
    } else if (shape === 'square') {
      ctx.rect(x - half, y - half, size, size);
    } else if (shape === 'rounded') {
      ctx.roundRect(x - half, y - half, size, size, half * 0.45);
    } else if (shape === 'diamond') {
      ctx.moveTo(x, y - half);
      ctx.lineTo(x + half, y);
      ctx.lineTo(x, y + half);
      ctx.lineTo(x - half, y);
      ctx.closePath();
    }
    ctx.fill();
  }

  function drawCustomFinder(ctx, startX, startY, cellSize, style, fillStyle) {
    ctx.save();
    ctx.fillStyle = fillStyle;
    const size7 = cellSize * 7;
    const size5 = cellSize * 5;
    const size3 = cellSize * 3;

    if (style === 'classic') {
      ctx.fillRect(startX, startY, size7, size7);
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(startX + cellSize, startY + cellSize, size5, size5);
      ctx.fillStyle = fillStyle;
      ctx.fillRect(startX + cellSize * 2, startY + cellSize * 2, size3, size3);
    } 
    else if (style === 'rounded') {
      ctx.beginPath();
      ctx.roundRect(startX, startY, size7, size7, cellSize * 1.6);
      ctx.fill();

      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.roundRect(startX + cellSize, startY + cellSize, size5, size5, cellSize * 1.1);
      ctx.fill();

      ctx.fillStyle = fillStyle;
      ctx.beginPath();
      ctx.roundRect(startX + cellSize * 2, startY + cellSize * 2, size3, size3, cellSize * 0.6);
      ctx.fill();
    } 
    else if (style === 'circle') {
      const cx = startX + size7 / 2;
      const cy = startY + size7 / 2;

      ctx.beginPath();
      ctx.arc(cx, cy, size7 / 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(cx, cy, size5 / 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = fillStyle;
      ctx.beginPath();
      ctx.arc(cx, cy, size3 / 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function triggerGenerate() {
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    const isAnim = document.getElementById('enableAnimation').checked;

    if (isAnim) {
      function loop() {
        animProgress = (animProgress + 0.015) % 1;
        renderCanvasFrame();
        animationFrameId = requestAnimationFrame(loop);
      }
      loop();
    } else {
      renderCanvasFrame();
    }
  }

  function renderCanvasFrame() {
    const text = getPayload();
    const canvas = document.getElementById('qrCanvas');
    const ctx = canvas.getContext('2d');
    const downloadBtn = document.getElementById('downloadBtn');

    const contrast = parseFloat(document.getElementById('contrastRange').value);
    const dotRatio = parseFloat(document.getElementById('dotSizeRange').value);
    const dotShape = document.getElementById('dotShape').value;
    const finderShape = document.getElementById('finderShape').value;
    const isGradient = document.getElementById('enableGradient').checked;
    const isGlass = document.getElementById('enableGlass').checked;
    const showLogo = document.getElementById('showLogoBadge').checked;
    const isAnim = document.getElementById('enableAnimation').checked;

    if (!text || !cachedImg) return;

    const qr = qrcode(0, 'H');
    qr.addData(text);
    qr.make();

    const count = qr.getModuleCount();
    const size = 600;
    canvas.width = size;
    canvas.height = size;
    const cellSize = size / count;

    // 1. رسم وتوسيط الصورة
    const hRatio = size / cachedImg.width;
    const vRatio = size / cachedImg.height;
    const ratio = Math.max(hRatio, vRatio);
    const centerShiftX = (size - cachedImg.width * ratio) / 2;
    const centerShiftY = (size - cachedImg.height * ratio) / 2;

    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, size, size);
    ctx.drawImage(cachedImg, 0, 0, cachedImg.width, cachedImg.height, centerShiftX, centerShiftY, cachedImg.width * ratio, cachedImg.height * ratio);

    // 2. تطبيق التباين والتدرج الرمادي
    const imgData = ctx.getImageData(0, 0, size, size);
    const d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
      let gray = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
      gray = ((gray / 255 - 0.5) * contrast + 0.5) * 255;
      gray = Math.max(0, Math.min(255, gray));
      d[i] = gray;
      d[i + 1] = gray;
      d[i + 2] = gray;
    }
    ctx.putImageData(imgData, 0, 0);

    // 3. التأثير الزجاجي
    if (isGlass) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
      ctx.fillRect(0, 0, size, size);
    }

    // 4. التدرج اللوني
    let darkColor = '#000000';
    if (isGradient) {
      const g = ctx.createLinearGradient(0, 0, size, size);
      g.addColorStop(0, document.getElementById('gradColor1').value);
      g.addColorStop(1, document.getElementById('gradColor2').value);
      darkColor = g;
    }

    // 5. رسم نقاط الـ QR
    for (let r = 0; r < count; r++) {
      for (let c = 0; c < count; c++) {
        if (!isInsideFinder(r, c, count) && !isInsideCenterLogo(r, c, count)) {
          const isDark = qr.isDark(r, c);
          const cx = c * cellSize + cellSize / 2;
          const cy = r * cellSize + cellSize / 2;

          ctx.fillStyle = isDark ? darkColor : 'rgba(255, 255, 255, 0.88)';
          drawModule(ctx, dotShape, cx, cy, cellSize * dotRatio * 2);
        }
      }
    }

    // 6. رسم زوايا التوجيه
    drawCustomFinder(ctx, 0, 0, cellSize, finderShape, darkColor);
    drawCustomFinder(ctx, (count - 7) * cellSize, 0, cellSize, finderShape, darkColor);
    drawCustomFinder(ctx, 0, (count - 7) * cellSize, cellSize, finderShape, darkColor);

    // 7. شعار المنتصف
    if (showLogo) {
      const badgeW = cellSize * 9.5;
      const badgeH = cellSize * 4.2;
      const bx = (size - badgeW) / 2;
      const by = (size - badgeH) / 2;

      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.roundRect(bx, by, badgeW, badgeH, 12);
      ctx.fill();

      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${Math.floor(cellSize * 2.1)}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('6m4.me', size / 2, size / 2 + 1);
      ctx.restore();
    }

    // 8. تأثير الليزر والمسح المتحرك
    if (isAnim) {
      const scanY = animProgress * size;
      const laserGrad = ctx.createLinearGradient(0, scanY - 20, 0, scanY + 20);
      laserGrad.addColorStop(0, 'rgba(56, 189, 248, 0)');
      laserGrad.addColorStop(0.5, 'rgba(56, 189, 248, 0.6)');
      laserGrad.addColorStop(1, 'rgba(56, 189, 248, 0)');

      ctx.fillStyle = laserGrad;
      ctx.fillRect(0, scanY - 20, size, 40);

      // خط ليزر مركزي فائق التوهج
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(0, scanY - 1, size, 2);
    }

    canvas.style.display = 'block';
    downloadBtn.style.display = 'block';
  }

  function downloadQR() {
    const canvas = document.getElementById('qrCanvas');
    const link = document.createElement('a');
    link.download = '6m4-qr.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }
</script>
