<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مولّد QR بالصور الفنية</title>
  <!-- مكتبة توليد رمز QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 1.35rem;
      text-align: center;
      margin-bottom: 20px;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: white;
      outline: none;
      font-size: 0.9rem;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      font-size: 0.95rem;
    }

    button:hover {
      background: var(--primary-hover);
    }

    .preview-box {
      margin-top: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      background: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .download-btn {
      background: #10b981;
      margin-top: 14px;
      display: none;
    }

    .download-btn:hover {
      background: #059669;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>مولّد رمز QR بالصور</h1>

  <div class="form-group">
    <label>الرابط أو النص:</label>
    <input type="text" id="qrText" value="https://google.com" placeholder="أدخل الرابط أو النص">
  </div>

  <div class="form-group">
    <label>اختر الصورة الشخصية:</label>
    <input type="file" id="imageInput" accept="image/*">
  </div>

  <div class="controls-grid">
    <div class="form-group">
      <label>تباين الصورة (Contrast):</label>
      <input type="range" id="contrastRange" min="1" max="2.5" step="0.1" value="1.4">
    </div>
    <div class="form-group">
      <label>حجم نقاط الـ QR:</label>
      <input type="range" id="dotSizeRange" min="0.25" max="0.45" step="0.02" value="0.34">
    </div>
  </div>

  <button onclick="generateCustomQR()">إنشاء الرمز</button>

  <div class="preview-box">
    <canvas id="qrCanvas" width="600" height="600" style="display:none;"></canvas>
    <button id="downloadBtn" class="download-btn" onclick="downloadQR()">تحميل الرمز بصيغة PNG</button>
  </div>
</div>

<script>
  let cachedImg = null;

  // قراءة الصورة عند اختيارها وتوليد الرمز تلقائياً
  document.getElementById('imageInput').addEventListener('change', function(e) {
    if (e.target.files && e.target.files[0]) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        cachedImg = new Image();
        cachedImg.onload = generateCustomQR;
        cachedImg.src = evt.target.result;
      };
      reader.readAsDataURL(e.target.files[0]);
    }
  });

  // تحديث الرمز مباشرة عند تغيير إعدادات الأشرطة
  document.getElementById('contrastRange').addEventListener('input', () => {
    if (cachedImg) generateCustomQR();
  });
  document.getElementById('dotSizeRange').addEventListener('input', () => {
    if (cachedImg) generateCustomQR();
  });

  // استبعاد مناطق زوايا التوجيه لتجنب تداخل نقاط الصورة
  function isInFinderZone(r, c, count) {
    if (r < 8 && c < 8) return true;
    if (r < 8 && c >= count - 8) return true;
    if (r >= count - 8 && c < 8) return true;
    return false;
  }

  // رسم مربع زاوية توجيه ككتلة هندسية واحدة لمنع ظهور أي فواصل أو شبكات
  function drawCleanFinder(ctx, startX, startY, cellSize) {
    // 1. مسح النطاق (8x8) بلون أبيض نقي
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(startX - 0.5, startY - 0.5, cellSize * 8 + 1, cellSize * 8 + 1);

    // 2. الإطار الخارجي الأسود (7x7)
    ctx.fillStyle = '#000000';
    ctx.fillRect(startX, startY, cellSize * 7, cellSize * 7);

    // 3. الإطار الأوسط الأبيض (5x5)
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(startX + cellSize, startY + cellSize, cellSize * 5, cellSize * 5);

    // 4. المربع الداخلي الأسود (3x3)
    ctx.fillStyle = '#000000';
    ctx.fillRect(startX + cellSize * 2, startY + cellSize * 2, cellSize * 3, cellSize * 3);
  }

  function generateCustomQR() {
    const text = document.getElementById('qrText').value.trim();
    const canvas = document.getElementById('qrCanvas');
    const ctx = canvas.getContext('2d');
    const downloadBtn = document.getElementById('downloadBtn');
    const contrast = parseFloat(document.getElementById('contrastRange').value);
    const dotRatio = parseFloat(document.getElementById('dotSizeRange').value);

    if (!text) return alert("يرجى إدخال الرابط أولاً");
    if (!cachedImg) return alert("يرجى اختيار صورة أولاً");

    // 1. توليد كود الـ QR بأعلى دقة لتصحيح الأخطاء (Level H)
    const qr = qrcode(0, 'H');
    qr.addData(text);
    qr.make();

    const count = qr.getModuleCount();
    const size = 600;
    canvas.width = size;
    canvas.height = size;
    const cellSize = size / count;

    // 2. ضبط وتوسيط الصورة بنمط Cover
    const hRatio = size / cachedImg.width;
    const vRatio = size / cachedImg.height;
    const ratio = Math.max(hRatio, vRatio);
    const centerShiftX = (size - cachedImg.width * ratio) / 2;
    const centerShiftY = (size - cachedImg.height * ratio) / 2;

    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, size, size);
    ctx.drawImage(cachedImg, 0, 0, cachedImg.width, cachedImg.height, centerShiftX, centerShiftY, cachedImg.width * ratio, cachedImg.height * ratio);

    // 3. تحويل ألوان الصورة إلى الأبيض والأسود عالي التباين
    const imgData = ctx.getImageData(0, 0, size, size);
    const d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
      let gray = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
      gray = ((gray / 255 - 0.5) * contrast + 0.5) * 255;
      gray = Math.max(0, Math.min(255, gray));
      d[i] = gray;
      d[i + 1] = gray;
      d[i + 2] = gray;
    }
    ctx.putImageData(imgData, 0, 0);

    // 4. رسم نقاط البيانات فوق الصورة
    for (let r = 0; r < count; r++) {
      for (let c = 0; c < count; c++) {
        if (!isInFinderZone(r, c, count)) {
          const isDark = qr.isDark(r, c);
          const centerX = c * cellSize + cellSize / 2;
          const centerY = r * cellSize + cellSize / 2;

          ctx.beginPath();
          ctx.arc(centerX, centerY, cellSize * dotRatio, 0, Math.PI * 2);
          ctx.fillStyle = isDark ? 'rgba(0, 0, 0, 0.92)' : 'rgba(255, 255, 255, 0.88)';
          ctx.fill();
        }
      }
    }

    // 5. رسم زوايا التوجيه الصريحة بدون أي فواصل
    drawCleanFinder(ctx, 0, 0, cellSize); // أعلى اليسار
    drawCleanFinder(ctx, (count - 7) * cellSize, 0, cellSize); // أعلى اليمين
    drawCleanFinder(ctx, 0, (count - 7) * cellSize, cellSize); // أسفل اليسار

    canvas.style.display = 'block';
    downloadBtn.style.display = 'block';
  }

  function downloadQR() {
    const canvas = document.getElementById('qrCanvas');
    const link = document.createElement('a');
    link.download = 'art-qr.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }
</script>

</body>
</html>
